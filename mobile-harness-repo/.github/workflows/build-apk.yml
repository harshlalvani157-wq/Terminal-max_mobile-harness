name: Build Mobile Harness APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant (online or offline)'
choice  required: true
        default: 'online'
        type: choicechoice
        options:
          - online
          - offlineofflineofflineoffline
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursiverecursiverecursiverecursiverecursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0"

      - name: Ensure gradlew executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        env:
          VARIANT: ${{ inputs.variant || 'online' }}
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
        run: |
          # Capitalize first letter of variant and build type for Gradle task name
          # e.g., online + debug => assembleOnlineDebug
          VAR_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${VARIANT:0:1})${VARIANT:1}"
          TYPE_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${BUILD_TYPE:0:1})${BUILD_TYPE:1}"
          TASK="assemble${VAR_CAP}${TYPE_CAP}"
          echo "Executing Gradle task: ./gradlew $TASK"
          ./gradlew "$TASK" --stacktrace

      - name: Locate and Rename APK
        id: apk-finder
        run: |
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file generated!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          ls -lh "$APK_FILE"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-${{ inputs.variant || 'online' }}-${{ inputs.build_type || 'debug' }}
          path: ${{ steps.apk-finder.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14